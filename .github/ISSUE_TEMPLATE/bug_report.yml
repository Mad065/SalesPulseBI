name: Bug Report
description: Report a bug or unexpected behavior in SalesPulseBI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `salespulsebi ...`
        2. Upload or link folder ...
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment (OS & Python version)
      placeholder: "macOS 15 / Python 3.12"
