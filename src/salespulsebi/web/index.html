<!DOCTYPE html>
<html lang="es" data-theme="dark" data-style="precision">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>SalesPulseBI — Local-First Sales Intelligence</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Header / Global Command Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          id="btn-sidebar-toggle"
          class="btn btn-secondary btn-sm sidebar-toggle-btn hidden"
          title="Ocultar / Mostrar barra lateral (⌘B / Ctrl+B)"
          aria-label="Ocultar o mostrar barra lateral"
          aria-expanded="true"
          aria-controls="sidebar"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2.5"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <button id="btn-home" class="brand-btn" title="Project Hub">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="url(#sp_grad)" />
            <path d="M6 20L11.5 14.5L16 18L21.5 10L26 13" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="21.5" cy="10" r="2.2" fill="#2DD4BF"/>
            <defs>
              <linearGradient id="sp_grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop stop-color="#2563EB"/>
                <stop offset="1" stop-color="#0D9488"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-name">SalesPulse<strong>BI</strong></span>
        </button>

        <div id="active-project-crumb" class="project-crumb hidden">
          <span class="crumb-sep" aria-hidden="true">/</span>
          <span id="crumb-project-name" class="crumb-title"></span>
          <span class="crumb-sep" aria-hidden="true">›</span>
          <span id="crumb-active-view" class="pill pill-accent crumb-view-badge"></span>
          <span id="crumb-project-meta" class="pill pill-muted tabular"></span>
          <button type="button" id="crumb-project-currency" class="pill pill-accent pill-btn tabular" title="Configurar moneda y tipo de cambio"></button>
        </div>
      </div>

      <div class="topbar-right">
        <div id="project-actions-bar" class="topbar-group hidden">
          <div class="topbar-cluster">
            <button type="button" id="btn-quick-add-files" class="btn btn-secondary btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
              </svg>
              <span data-i18n="add_files_btn">+ Archivos</span>
            </button>
            <button id="btn-sync-now" class="btn btn-secondary btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 16h5v5"/>
              </svg>
              <span data-i18n="sync_now">Sincronizar</span>
            </button>
            <div class="dropdown">
              <button id="btn-export-menu" class="btn btn-secondary btn-sm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span data-i18n="export">Exportar</span>
                <span aria-hidden="true">▾</span>
              </button>
              <div id="export-dropdown" class="dropdown-menu hidden">
                <button class="dropdown-item" data-export="html-report" data-i18n="export_html">Reporte Ejecutivo (HTML/PDF)</button>
                <button class="dropdown-item" data-export="xlsx" data-i18n="export_xlsx">Excel (.xlsx)</button>
                <button class="dropdown-item" data-export="csv" data-i18n="export_csv">CSV Limpio (.csv)</button>
                <button class="dropdown-item" data-export="parquet" data-i18n="export_parquet">Parquet (.parquet)</button>
              </div>
            </div>
            <button type="button" id="btn-project-settings" class="btn btn-secondary btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              <span data-i18n="settings">Configuración</span>
            </button>
          </div>

          <span class="topbar-divider" aria-hidden="true"></span>

          <button type="button" id="btn-copilot-toggle" class="btn btn-primary btn-sm" title="AI Copilot (⌘K / Ctrl+K)" aria-expanded="false" aria-controls="copilot-drawer">
            <span aria-hidden="true">✦</span>
            <span data-i18n="copilot_btn">Copiloto IA</span>
            <kbd class="kbd-hint">⌘K</kbd>
          </button>

          <span class="topbar-divider" aria-hidden="true"></span>
        </div>

        <div class="topbar-cluster">
          <button type="button" id="btn-global-settings" class="btn btn-secondary btn-sm" title="Configuración General">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="4" y1="21" x2="4" y2="14"/>
              <line x1="4" y1="10" x2="4" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12" y2="3"/>
              <line x1="20" y1="21" x2="20" y2="16"/>
              <line x1="20" y1="12" x2="20" y2="3"/>
              <line x1="1" y1="14" x2="7" y2="14"/>
              <line x1="9" y1="8" x2="15" y2="8"/>
              <line x1="17" y1="16" x2="23" y2="16"/>
            </svg>
            <span data-i18n="global_settings">Configuración General</span>
          </button>

          <button id="btn-lang-toggle" class="btn btn-ghost btn-sm" title="Switch Language">
            <span id="lang-label">ES</span>
          </button>
          <button id="btn-theme-toggle" class="btn btn-ghost btn-sm" title="Toggle Light / Dark Theme" aria-label="Toggle Light / Dark Theme">
            <span id="theme-icon" aria-hidden="true">☀</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Workspace Body -->
    <div class="workspace-body">
      <!-- Sidebar (shown when a project is active) -->
      <aside id="sidebar" class="sidebar hidden" aria-label="Project Navigation">
        <nav class="nav-list">
          <div class="nav-section-label" data-i18n="nav_group_analytics">Inteligencia Comercial</div>
          <button class="nav-item active" data-tab="overview">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                <rect x="3" y="16" width="7" height="5" rx="1.5"/>
              </svg>
            </span>
            <span data-i18n="nav_overview">Resumen</span>
          </button>

          <button class="nav-item" data-tab="timeseries">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <path d="m19 9-5 5-4-4-3 3"/>
              </svg>
            </span>
            <span data-i18n="nav_timeseries">Tiempo & Pronóstico</span>
            <span class="lock-badge hidden" data-lock="timeseries" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
          </button>

          <button class="nav-item" data-tab="products">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16.5 9.4 7.55 4.24"/>
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.29 7 12 12 20.71 7"/>
                <line x1="12" y1="22" x2="12" y2="12"/>
              </svg>
            </span>
            <span data-i18n="nav_products">Productos & ABC</span>
            <span class="lock-badge hidden" data-lock="products" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
          </button>

          <button class="nav-item" data-tab="customers">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </span>
            <span data-i18n="nav_customers">Clientes & RFM</span>
            <span class="lock-badge hidden" data-lock="customers" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
          </button>

          <button class="nav-item" data-tab="dimensions">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
              </svg>
            </span>
            <span data-i18n="nav_dimensions">Canales & Ad-Hoc</span>
          </button>

          <div class="nav-section-label" data-i18n="nav_group_ai">IA & Predictivo</div>
          <button class="nav-item" data-tab="ai_ml">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4"/>
                <path d="M12 18v4"/>
                <path d="m4.93 4.93 2.83 2.83"/>
                <path d="m16.24 16.24 2.83 2.83"/>
                <path d="M2 12h4"/>
                <path d="M18 12h4"/>
                <path d="m4.93 19.07 2.83-2.83"/>
                <path d="m16.24 7.76 2.83-2.83"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
            <span data-i18n="nav_ai_ml">AI & ML Studio</span>
          </button>

          <div class="nav-section-label" data-i18n="nav_group_data">Ingeniería de Datos</div>
          <button class="nav-item" data-tab="data_studio">
            <span class="nav-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M3 5V19A9 3 0 0 0 21 19V5"/>
                <path d="M3 12A9 3 0 0 0 21 12"/>
              </svg>
            </span>
            <span data-i18n="nav_data_studio">Data Studio</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button type="button" id="btn-sidebar-collapse-footer" class="btn btn-ghost btn-sm full-width sidebar-collapse-footer-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
              <polyline points="15 15 12 12 15 9"/>
            </svg>
            <span data-i18n="hide_sidebar">Ocultar barra lateral</span>
          </button>
          <button id="btn-back-hub" class="btn btn-ghost btn-sm full-width" data-i18n="back_to_projects">
            ← Todos los Proyectos
          </button>
        </div>
      </aside>

      <!-- Main Column -->
      <main class="main-column">
        <!-- Sticky Global Filter Bar (shown on active project tabs except Hub & Data Studio) -->
        <div id="filter-bar" class="filter-bar hidden" role="search" aria-label="Global Analytics Filters">
          <div class="filter-controls">
            <div class="filter-field">
              <label for="f-date-from" data-i18n="from">Desde</label>
              <input id="f-date-from" type="date" class="input input-sm" />
            </div>
            <div class="filter-field">
              <label for="f-date-to" data-i18n="to">Hasta</label>
              <input id="f-date-to" type="date" class="input input-sm" />
            </div>
            <div class="filter-field grow">
              <label for="f-search" data-i18n="search">Buscar</label>
              <input id="f-search" type="text" class="input input-sm" data-i18n-placeholder="search_ph" placeholder="Producto, cliente, pedido..." />
            </div>
            <div class="filter-field" id="wrap-f-category">
              <label for="f-category" data-i18n="category">Categoría</label>
              <select id="f-category" class="input input-sm"><option value="">All</option></select>
            </div>
            <div class="filter-field" id="wrap-f-region">
              <label for="f-region" data-i18n="region">Sucursal/Región</label>
              <select id="f-region" class="input input-sm"><option value="">All</option></select>
            </div>
            <div class="filter-field" id="wrap-f-channel">
              <label for="f-channel" data-i18n="channel">Canal</label>
              <select id="f-channel" class="input input-sm"><option value="">All</option></select>
            </div>
            <div class="filter-field" id="wrap-f-folder">
              <label for="f-folder" data-i18n="folder">Carpeta/Origen</label>
              <select id="f-folder" class="input input-sm"><option value="">All</option></select>
            </div>
            <label class="checkbox-pill" title="Include cancelled/returned orders">
              <input id="f-include-excluded" type="checkbox" />
              <span data-i18n="include_cancelled">Incluir cancelados</span>
            </label>
            <button id="btn-reset-filters" class="btn btn-ghost btn-sm" data-i18n="reset">Limpiar</button>
          </div>
          <div class="filter-views-row">
            <div id="active-filter-chips" class="chips-row"></div>
            <div class="saved-views-controls">
              <select id="saved-views-select" class="input input-sm" aria-label="Saved Views">
                <option value="" data-i18n="saved_views">Vistas guardadas...</option>
              </select>
              <button id="btn-save-view" class="btn btn-secondary btn-sm" data-i18n="save_view">Guardar vista</button>
            </div>
          </div>
        </div>

        <!-- View Container -->
        <section id="view-container" class="view-container" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <!-- Streaming AI Copilot Side Drawer -->
  <aside id="copilot-drawer" class="copilot-drawer hidden" role="complementary" aria-label="AI Financial Copilot"></aside>

  <!-- Native Modal Dialog & Polite Reorder Announcer -->
  <dialog id="modal-dialog" class="modal-box" closedby="any" aria-labelledby="modal-dialog-title"></dialog>
  <p id="reorder-status" role="status" class="sr-only"></p>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
