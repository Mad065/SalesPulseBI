[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salespulsebi"
version = "0.1.0"
description = "Local-first, open-source Python Sales Intelligence web app with multi-file & folder ingestion, persistent projects, and adaptive DuckDB analytics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "SalesPulseBI Contributors" }
]
keywords = ["sales", "dashboard", "business-intelligence", "duckdb", "fastapi", "analytics", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "duckdb>=1.1",
  "openpyxl>=3.1",
  "rich>=13.9",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.7",
]

[project.scripts]
salespulsebi = "salespulsebi.cli:main"

[project.urls]
Homepage = "https://github.com/salespulsebi/salespulsebi"
Repository = "https://github.com/salespulsebi/salespulsebi"
Issues = "https://github.com/salespulsebi/salespulsebi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/salespulsebi"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/README.es.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
